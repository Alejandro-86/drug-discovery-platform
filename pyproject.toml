[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drug-discovery-platform"
version = "0.1.0"
description = "End-to-end data engineering platform for drug discovery — PostgreSQL, MongoDB, Neo4j, Qdrant"
requires-python = ">=3.11"
dependencies = [
    # PostgreSQL
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # MongoDB
    "pymongo>=4.7",
    # Neo4j
    "neo4j>=5.20",
    # Qdrant
    "qdrant-client>=1.9",
    # Embeddings
    "sentence-transformers>=3.0",
    # Ingestion
    "httpx>=0.27",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drug_discovery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
